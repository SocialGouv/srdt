{{- if and .Values.ingress.enabled .Values.ingress.web.host }}
# Host principal (front) : tout le host -> Service web (Next.js sert / et ses propres routes /api/*).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "srdt.fullname" . }}-web
  labels:
    {{- include "srdt.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.web.host | quote }}
      {{- with .Values.ingress.web.tlsSecretName }}
      secretName: {{ . }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.web.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "srdt.fullname" . }}-web
                port:
                  number: {{ .Values.web.service.port }}
{{- end }}
