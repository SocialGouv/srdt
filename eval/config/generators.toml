# Largest open-weight model on Scaleway; 26 s / 42 s on the smallest / largest prompt
# (2026-10-29, runs/probe-qwen), production structure and citation format followed.
[[models]]
provider = "scaleway"
model = "scaleway/qwen3.5-397b-a17b"
name = "qwen3.5-397b@scaleway"
params = { temperature = 0.3 }

