# Default values — platform-agnostic. Environment-specific values live in the gitops repo.
# No secrets here: secrets are referenced BY NAME and provided by ExternalSecrets (gitops).

global:
  # Registry prefix for the image, e.g. "pic-registry.sg.social.gouv.fr/socialgouv/.../srdt".
  imageRegistry: ""
  imagePullSecrets: []        # e.g. [{ name: registry-pull-secret }]
  extraLabels: {}

image:
  repository: web             # final ref = <global.imageRegistry>/<repository>:<tag>
  tag: ""                     # defaults to .Chart.AppVersion when empty
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

replicaCount: 1

service:
  port: 80
  targetPort: 3000            # Next.js standalone (node server.js) écoute sur 3000

ingress:
  enabled: true
  className: ""
  host: ""                    # <host> par environnement (gitops)
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "180"
  tls:
    enabled: true
    secretName: ""            # requis pour cert-manager (ingress-shim) sur Atlas

probes:
  path: /api/healthz          # route healthz interne du front Next.js
  port: 3000

resources:
  requests:
    cpu: "400m"
    memory: "512Mi"
  limits:
    cpu: "400m"
    memory: "1024Mi"

# securityContext — front non-root (Dockerfile USER 1000), rootfs en lecture seule.
# Next.js (standalone) écrit son cache → emptyDir (cf. volumes). Compatible PSA restricted.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  capabilities:
    drop: ["ALL"]

# rootfs read-only → Next écrit son cache (.next/cache) + /tmp via emptyDir.
volumes:
  - name: tmp
    emptyDir: {}
  - name: next-cache
    emptyDir: {}
volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: next-cache
    mountPath: /app/.next/cache

# Non-secret env injecté directement. API_BASE_URL (=https://api-<host>) et NEXTAUTH_URL
# (=https://<host>) sont fournis par environnement (gitops), car dérivés des hosts.
env: {}

# Rendered into a ConfigMap (name = fullname) and loaded via envFrom.
# Per-env keys (gitops): CHATGPT_MODEL_NAME, MISTRAL_MODEL_NAME, ALBERT_MODEL_NAME,
# NEXTAUTH_URL, PROCONNECT_ENV, NEXT_PUBLIC_PROCONNECT_ENV, DEFAULT_MODEL_FAMILY, ...
configMap:
  data: {}

# Names of pre-existing Secrets (created by ExternalSecrets in the gitops repo), loaded via envFrom.
# Map key = libellé libre ; value = nom du Secret. Mettre "" pour ignorer une entrée.
# database : laissé vide par défaut — le gitops fournit la connexion DB (envFrom secret CNPG
#            <cluster>-app, ou extraEnv DATABASE_URL <- clé `uri`), selon ce qu'attend le code web.
secrets:
  app: web-secret             # clés LLM (gpt/mistral/albert), PROCONNECT_CLIENT_SECRET, NextAuth, BETA_TESTERS_LIST
  database: ""

# Extra container env entries (raw items, support valueFrom). Ex. DATABASE_URL <- secret CNPG :
#   extraEnv:
#     - name: DATABASE_URL
#       valueFrom: { secretKeyRef: { name: <cluster>-app, key: uri } }
extraEnv: []

serviceAccount:
  create: true
  name: ""

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Stakater Reloader (opt-in) : auto-restart du pod quand un ConfigMap/Secret référencé change.
reloader:
  auto: false
