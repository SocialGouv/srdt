# Default values — plateforme-agnostique. Les valeurs spécifiques à l'environnement vivent dans le repo gitops.
# Aucun secret ici : les secrets sont référencés PAR NOM et fournis par des ExternalSecrets (gitops).
#
# srdt = 2 composants sur 2 hosts distincts (≠ graal qui route 1 host par chemin) :
#   web (Next.js)  -> https://<ingress.web.host>          : sert / + ses PROPRES routes /api/auth, /api/healthz
#   api (FastAPI)  -> https://<ingress.api.host>  (RAG)   : sert /api/v1/* ; le web l'appelle via API_BASE_URL
# 2 hosts (et non un routing par chemin) car le web Next.js a ses propres routes /api -> collision sinon.

global:
  # Préfixe registre commun aux 2 images, ex.
  # "pic-registry.sg.social.gouv.fr/socialgouv/produits-dnum/citoyens/srdt/srdt".
  imageRegistry: ""
  imagePullSecrets: []        # ex. [{ name: registry-pull-secret }]
  extraLabels: {}

nameOverride: ""
fullnameOverride: ""

# --- api (FastAPI / RAG) — stateless (retrieval ES + Albert, génération LLM), scalable. -----
# Aucune DB au runtime (l'ingestion qui peuple l'ES est offline, hors de ce déploiement).
api:
  image:
    repository: api           # ref finale = <global.imageRegistry>/api:<tag|appVersion>
    tag: ""                   # défaut = .Chart.AppVersion
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    port: 80
    targetPort: 3000          # uvicorn écoute sur $API_PORT (dérivé = 3000, cf. configmap)
  probes:
    path: /api/v1/healthz     # FastAPI : {BASE_API_URL}/healthz, BASE_API_URL=/api/v1
    port: 3000
  resources:
    # LimitRange du ns Atlas : limits.memory / requests.memory ≤ 2.
    requests: { cpu: "200m", memory: "512Mi" }
    limits: { cpu: "800m", memory: "1024Mi" }
  # rootfs read-only (Dockerfile USER 1000) -> écritures dans des emptyDirs. Compatible PSA restricted.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    capabilities:
      drop: ["ALL"]
  volumes:
    - name: tmp
      emptyDir: {}
    - name: cache
      emptyDir: {}
    - name: home
      emptyDir: {}
  volumeMounts:
    - name: tmp
      mountPath: /app/tmp
    - name: cache
      mountPath: /app/cache
    - name: home
      mountPath: /app/home
  # Env non-secret -> ConfigMap (envFrom). API_PORT / API_HOST sont dérivés (cf. configmap.yaml).
  # Clés par-env posées dans le gitops : ELASTIC_HOSTNAME, ALBERT_ENDPOINT,
  # ALBERT_VECTORISATION_MODEL, TIKTOKEN_TOKENIZER_MODEL, ...
  configMap:
    data: {}
  # Noms de Secrets pré-existants (créés par ExternalSecrets côté gitops), chargés via envFrom.
  # Clé = libellé libre ; valeur = nom du Secret ("" pour ignorer une entrée).
  secrets:
    app: www-secret           # AUTH_API_KEY, ALBERT_API_KEY, ELASTIC_API_KEY
  # Env additionnels bruts (supportent valueFrom).
  extraEnv: []

# --- web (Next.js standalone) — front + auth ProConnect + multi-LLM ; DB Postgres propre. ---
web:
  image:
    repository: web           # ref finale = <global.imageRegistry>/web:<tag|appVersion>
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    port: 80
    targetPort: 3000          # Next.js standalone (node server.js) écoute sur 3000
  probes:
    path: /api/healthz        # route healthz interne du front Next.js
    port: 3000
  resources:
    requests: { cpu: "400m", memory: "512Mi" }
    limits: { cpu: "400m", memory: "1024Mi" }
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    capabilities:
      drop: ["ALL"]
  volumes:
    - name: tmp
      emptyDir: {}
    - name: next-cache
      emptyDir: {}
  volumeMounts:
    - name: tmp
      mountPath: /tmp
    - name: next-cache
      mountPath: /app/.next/cache
  # Env non-secret -> ConfigMap. NEXTAUTH_URL (host web) et API_BASE_URL (host api) sont dérivés
  # (cf. configmap.yaml). Clés par-env (gitops) : CHATGPT_MODEL_NAME, MISTRAL_MODEL_NAME,
  # ALBERT_MODEL_NAME, DEFAULT_MODEL_FAMILY, PROCONNECT_ENV, NEXT_PUBLIC_PROCONNECT_ENV, ...
  configMap:
    data: {}
  secrets:
    app: web-secret           # clés LLM (gpt/mistral/albert), PROCONNECT_CLIENT_SECRET, NextAuth, BETA_TESTERS_LIST
  # DB : le web lit DATABASE_URL (var unique). Fourni par le gitops depuis le secret CNPG
  # <cluster>-app (clé `uri`) via extraEnv, ex. :
  #   extraEnv:
  #     - name: DATABASE_URL
  #       valueFrom: { secretKeyRef: { name: srdt-db-app, key: uri } }
  extraEnv: []

ingress:
  enabled: true
  className: ""               # Atlas workload-zone : "public" (posé côté gitops)
  # Annotations communes aux 2 hosts (l'api RAG peut être lente : appels Albert + ES -> timeouts généreux).
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "180"
  tls:
    enabled: true
  web:
    host: ""                  # <host> par environnement (gitops) — front
    tlsSecretName: ""         # REQUIS pour que cert-manager émette le certificat (Atlas)
  api:
    host: ""                  # api-<host> par environnement (gitops) — RAG
    tlsSecretName: ""

serviceAccount:
  create: true
  name: ""

# Stakater Reloader (opt-in) : redémarre les pods quand leur ConfigMap/Secret (envFrom) change.
reloader:
  auto: false

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
