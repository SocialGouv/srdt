# ============================================================================
# srdt — CI + CD sur GitLab PIC (dépôt PRIMAIRE). Migré de GitHub Actions + kontinuous.
#   check   : lint API (ruff) — non bloquant au 1er jet
#   build   : 2 images (api FastAPI/RAG + web Next.js) via BuildKit DinD mutualisé (ci-common)
#   publish : chart Helm `charts/srdt` en OCI (référence les 2 images par appVersion=sha)
#   deploy  : DÉCLENCHE le pipeline srdt-gitops (trigger multi-projet, CI_JOB_TOKEN
#             + allowlist inbound côté gitops — déjà posée). Pas de token gitops ici.
#   release : semantic-release (branche par défaut)
# Déploiement : Atlas v2 (zone dev) via ArgoCD synchronisant srdt-gitops.
# Voir docs/30-migrations/srdt.md.
#
# Variables CI/CD requises : SEMANTIC_RELEASE_TOKEN (release).  Backend build = DinD -> AUCUNE
#   variable BUILDKIT_* requise.
# api et web sont des sous-projets indépendants -> contexte de build PAR composant (api/, web/),
#   contrairement à graal (contexte racine partagé). Aucun build-arg applicatif :
#   - web : les NEXT_PUBLIC_* sont injectés au RUNTIME (configMap), pas au build ;
#           le secret de build Sentry est `required=false` -> ignoré sans le fournir.
# ============================================================================

include:
  - project: socialgouv/produits-dnum/communs/ci-common
    ref: main
    file: templates/image-build.yml
  - project: socialgouv/produits-dnum/communs/ci-common
    ref: main
    file: templates/publish-chart.yml

variables:
  CHART_DIR: charts/srdt
  # Version immuable par-commit : 1 SEULE source de vérité (publish-chart + triggers gitops).
  CHART_VERSION: "0.0.0-sha.${CI_COMMIT_SHORT_SHA}"

stages:
  - check
  - build
  - publish
  - deploy
  - release

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_COMMIT_BRANCH

# build/publish : branches de feature (review) + branche par défaut (image déployable)
.build-rules: &build-rules
  - if: $CI_COMMIT_BRANCH =~ /^(feat|fix|chore|hotfix|migration)\//
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
# deploy review : uniquement les branches de feature
.review-rules: &review-rules
  - if: $CI_COMMIT_BRANCH =~ /^(feat|fix|chore|hotfix|migration)\//

# ---------------------------------------------------------------------------
# CHECK : lint API (ruff, config dans api/pyproject.toml). Non bloquant au 1er jet.
# (Tests pytest+Postgres et lint/tests web = à câbler dans un 2e temps.)
# ---------------------------------------------------------------------------
lint-api:
  stage: check
  image: python:3.12-slim
  interruptible: true
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH
  script:
    - pip install --no-cache-dir ruff
    - ruff check api

# ---------------------------------------------------------------------------
# BUILD : 2 images via le backend DinD mutualisé (ci-common) -> registre PIC.
# srdt = produit -> backend `.build-dind` (runners PIC OK, pas de mTLS/daemon distant).
# Contexte PAR composant (api/, web/) : chaque Dockerfile fait COPY depuis SON dossier.
# ---------------------------------------------------------------------------
build:
  extends: .build-dind
  interruptible: true
  parallel:
    matrix:
      - COMPONENT: api
        BUILD_IMAGE: "$CI_REGISTRY_IMAGE/api"
        BUILD_CONTEXT: "api"
        BUILD_DOCKERFILE: "Dockerfile"
      - COMPONENT: web
        BUILD_IMAGE: "$CI_REGISTRY_IMAGE/web"
        BUILD_CONTEXT: "web"
        BUILD_DOCKERFILE: "Dockerfile"
  variables:
    BUILD_TAGS: "sha-$CI_COMMIT_SHA,$CI_COMMIT_REF_SLUG"
  rules: *build-rules

# PUBLISH : chart Helm OCI (snapshot SHA). appVersion = sha immuable = tag des 2 images.
publish-chart:
  extends: .publish-chart
  needs: ["build"]
  rules: *build-rules

# ---------------------------------------------------------------------------
# DEPLOY : l'app DÉCLENCHE le pipeline srdt-gitops (CI_JOB_TOKEN + allowlist inbound),
# en passant DEPLOY_ACTION/SLUG/CHART_VERSION. Aucun token gitops stocké ici.
# ---------------------------------------------------------------------------
.deploy-trigger:
  stage: deploy
  variables:
    SLUG: "$CI_COMMIT_REF_SLUG"
  trigger:
    project: socialgouv/produits-dnum/citoyens/srdt/srdt-gitops
    branch: main
    strategy: depend

deploy-review:
  extends: .deploy-trigger
  needs: ["publish-chart"]
  rules: *review-rules
  variables:
    DEPLOY_ACTION: review
  environment:
    name: review/$CI_COMMIT_REF_SLUG

deploy-preprod:
  extends: .deploy-trigger
  needs: ["publish-chart"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    DEPLOY_ACTION: preprod
  environment:
    name: preprod

stop-review:
  extends: .deploy-trigger
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(feat|fix|chore|hotfix|migration)\//
      when: manual
      allow_failure: true
  variables:
    DEPLOY_ACTION: stop-review

# ---------------------------------------------------------------------------
# RELEASE : semantic-release sur la branche par défaut (tags + release GitLab).
# Nécessite .releaserc.json (plugin @semantic-release/gitlab) sinon défaut npm+github.
# ---------------------------------------------------------------------------
release:
  stage: release
  image: node:22-alpine
  variables:
    GIT_DEPTH: 0
    GITLAB_TOKEN: $SEMANTIC_RELEASE_TOKEN
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - apk add --no-cache git
  script:
    - npx --yes -p semantic-release -p @semantic-release/commit-analyzer -p @semantic-release/release-notes-generator -p @semantic-release/gitlab semantic-release
