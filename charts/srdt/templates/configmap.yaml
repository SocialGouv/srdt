# ConfigMap api : env non-secret du composant api. API_PORT/API_HOST dérivés -> verrouille la
# cohérence avec service.targetPort (piège legacy : uvicorn écoute sur $API_PORT, défaut 8000,
# alors que le Service cible 3000). Le reste vient de api.configMap.data (gitops).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "srdt.fullname" . }}-api
  labels:
    {{- include "srdt.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
data:
  {{- $api := .Values.api.configMap.data | default dict }}
  {{- if not (hasKey $api "API_PORT") }}
  API_PORT: {{ .Values.api.service.targetPort | quote }}
  {{- end }}
  {{- if not (hasKey $api "API_HOST") }}
  API_HOST: "0.0.0.0"
  {{- end }}
  {{- range $k, $v := $api }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
---
# ConfigMap web : env non-secret du composant web. NEXTAUTH_URL (host web) et API_BASE_URL
# (host api) dérivés des hosts si non fournis. Le reste vient de web.configMap.data (gitops).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "srdt.fullname" . }}-web
  labels:
    {{- include "srdt.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
data:
  {{- $web := .Values.web.configMap.data | default dict }}
  {{- if and (not (hasKey $web "NEXTAUTH_URL")) .Values.ingress.web.host }}
  NEXTAUTH_URL: {{ printf "https://%s" .Values.ingress.web.host | quote }}
  {{- end }}
  {{- if and (not (hasKey $web "API_BASE_URL")) .Values.ingress.api.host }}
  API_BASE_URL: {{ printf "https://%s" .Values.ingress.api.host | quote }}
  {{- end }}
  {{- range $k, $v := $web }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
