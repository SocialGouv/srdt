[project]
name = "acco-analysis"
version = "0.1.0"
description = "Temporary module: heat clauses of the ACCO agreements (extract, filter, cluster, label)"
requires-python = ">=3.12,<3.13"
dependencies = [
    # read-only use of ingestion's section splitter, so both see the same sections
    "ingestion",
    "httpx>=0.27",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "scikit-learn>=1.5",
    "tenacity>=9",
    "typer>=0.12",
    "cryptography>=43",
]

[project.scripts]
acco-analysis = "acco_analysis.cli:app"

[tool.uv.sources]
ingestion = { path = "../ingestion", editable = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "pyright>=1.1.389"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acco_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# the prompts are long French sentences
"src/acco_analysis/relevance.py" = ["E501"]
"src/acco_analysis/label.py" = ["E501"]
"src/acco_analysis/report.py" = ["E501"]
"src/acco_analysis/merge.py" = ["E501"]
"src/acco_analysis/coding.py" = ["E501"]
"src/acco_analysis/metrics_report.py" = ["E501"]
"src/acco_analysis/flavours.py" = ["E501"]
"src/acco_analysis/report_pdf.py" = ["E501"]  # quoted clauses
"src/acco_analysis/report_polish.py" = ["E501"]
"src/acco_analysis/note_rapprochement.py" = ["E501"]
"src/acco_analysis/flavours_report.py" = ["E501"]
"src/acco_analysis/codebook.py" = ["E501"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
