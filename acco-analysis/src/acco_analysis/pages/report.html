<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Note d'analyse</title>
<style>
:root {
  --bg: #f6f4ef; --panel: #fffdf8; --fg: #1f2421; --muted: #6a706b; --line: #ddd8cc;
  --accent: #b4491f; --accent-soft: #f4dfd3; --ink: #1b2a41;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #171a18; --panel: #1f2321; --fg: #e8e6df; --muted: #9aa09a; --line: #333a36;
    --accent: #e08b62; --accent-soft: #3a2a21; --ink: #e8e6df; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, sans-serif; }
a { color: var(--accent); }
#back, main { display: block; max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#back { padding-top: 14px; font-size: 14px; }
main { padding-top: 6px; padding-bottom: 80px; }
#fail { color: var(--accent); }

/* what Typst's HTML export produces: header, nav[role=doc-toc], h2/h3, p, ol, ul, figure.quote */
header h1 { font-size: 28px; line-height: 1.2; margin: 14px 0 6px; color: var(--ink); text-wrap: balance; }
header .sub { color: var(--muted); margin: 0 0 18px; }
nav[role="doc-toc"] { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 18px 12px; margin: 16px 0 8px; font-size: 15px; }
nav[role="doc-toc"] h2 { margin: 0 0 6px; padding: 0; border: 0; font-size: 12px; text-transform: uppercase;
  letter-spacing: .06em; color: var(--muted); }
nav ol { list-style: none; margin: 0; padding: 0; }
nav ol ol { padding-left: 1.4em; font-size: 14px; color: var(--muted); }
nav li { margin: 3px 0; }
nav a { text-decoration: none; color: inherit; }
nav a:hover { color: var(--accent); }
.prefix { color: var(--accent); font-weight: 600; margin-right: .35em; }
h2 { font-size: 21px; line-height: 1.3; margin: 2em 0 .6em; padding-top: .7em; border-top: 1px solid var(--line);
  color: var(--ink); scroll-margin-top: 12px; }
h3 { font-size: 17px; margin: 1.6em 0 .4em; color: var(--ink); scroll-margin-top: 12px; }
p { margin: .7em 0; }
.n { font-weight: 600; color: var(--accent); white-space: nowrap; }
ul { padding-left: 1.3em; }
li { margin: .5em 0; }
li > p { margin: 0; }
/* the findings of "L'essentiel": the only list at the top level of the page */
main > ol { list-style: none; counter-reset: finding; margin: 1.2em 0; padding: 6px 18px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
main > ol > li { counter-increment: finding; position: relative; padding-left: 36px; margin: 14px 0; }
main > ol > li::before { content: counter(finding); position: absolute; left: 0; top: 3px; width: 24px; height: 24px;
  border-radius: 50%; background: var(--accent); color: #fff; font-size: 12px; font-weight: 700;
  text-align: center; line-height: 24px; }
figure.quote { margin: 1.1em 0; padding: 12px 16px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; }
figure.quote blockquote { margin: 0; font-family: Georgia, serif; font-size: 16px; }
figure.quote figcaption { margin-top: 10px; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap;
  gap: 4px 12px; align-items: center; }
.chip { background: var(--accent-soft); border-radius: 999px; padding: 1px 10px; font-size: 12px; font-weight: 600;
  color: var(--accent); }
</style>
</head>
<body>
<a id="back" href="index.html">← Nuances des clauses chaleur</a>
<main id="main"><p id="fail" hidden></p></main>
<script src="gate.js"></script>
<script>
// the note is encrypted like the rest: gate.js asks for the password, then it is shown
Gate.text("data/report.dat").then(html => {
  const main = document.getElementById("main");
  main.innerHTML = html;
  // every link opens in a new tab; the agreement pages keep the opener, so the new tab
  // inherits the password already typed (gate.js keeps it in sessionStorage)
  for (const a of main.querySelectorAll("a[href]:not([href^='#'])")) {
    a.target = "_blank";
    a.rel = a.getAttribute("href").startsWith("accord.html") ? "opener" : "noopener";
  }
  const title = main.querySelector("h1");
  if (title) document.title = title.textContent;
  const target = location.hash && document.getElementById(location.hash.slice(1));
  if (target) target.scrollIntoView();
}).catch(e => {
  const fail = document.getElementById("fail");
  fail.textContent = "Impossible de charger la note : " + e.message; fail.hidden = false;
});
</script>
</body>
</html>
