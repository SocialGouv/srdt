[project]
name = "ingestion"
version = "0.1.0"
description = "Build a search index (OpenSearch or Elasticsearch) from CDTN, LEGI, KALI and Judilibre"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.30,<0.31",
    "beautifulsoup4>=4.14,<5",
    "boto3>=1.35",
    "httpx>=0.27",
    # exact pin: HTMLHeaderTextSplitter output changes within 0.3.x, and chunk text
    # must only change on purpose (CHUNKER_VERSION)
    "langchain-text-splitters==0.3.5",
    "lxml>=5.3,<6",  # used by HTMLHeaderTextSplitter
    "opensearch-py>=2.8,<3",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "regex>=2024.11",
    "requests>=2.32",
    "tenacity>=9",
    "typer>=0.12",
]

[project.scripts]
ingest = "ingestion.cli:app"

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "moto[s3]>=5",
    "pyright>=1.1.389",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
indent-width = 4
exclude = [".ruff_cache", "__pycache__", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
