{{- if and .Values.ingress.enabled .Values.ingress.api.host }}
# Host dédié à l'api RAG (api-<host>) : tout le host -> Service api. Le web l'appelle via API_BASE_URL.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "srdt.fullname" . }}-api
  labels:
    {{- include "srdt.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.api.host | quote }}
      {{- with .Values.ingress.api.tlsSecretName }}
      secretName: {{ . }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.api.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "srdt.fullname" . }}-api
                port:
                  number: {{ .Values.api.service.port }}
{{- end }}
