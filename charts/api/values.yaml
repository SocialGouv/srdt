# Default values — platform-agnostic. Environment-specific values live in the gitops repo.
# No secrets here: secrets are referenced BY NAME and provided by ExternalSecrets (gitops).

global:
  # Registry prefix for the image, e.g. "pic-registry.sg.social.gouv.fr/socialgouv/.../srdt".
  imageRegistry: ""
  imagePullSecrets: []        # e.g. [{ name: registry-pull-secret }]
  extraLabels: {}

image:
  repository: api             # final ref = <global.imageRegistry>/<repository>:<tag>
  tag: ""                     # defaults to .Chart.AppVersion when empty
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

replicaCount: 1

service:
  port: 80
  targetPort: 3000            # uvicorn écoute sur $API_PORT (= 3000, posé via configMap)

ingress:
  enabled: true
  className: ""
  host: ""                    # api-<host> par environnement (gitops)
  annotations:
    # L'api RAG peut être lente (appels Albert + ES) → timeouts généreux, comme le legacy.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "180"
  tls:
    enabled: true
    secretName: ""            # requis pour cert-manager (ingress-shim) sur Atlas

probes:
  path: /api/v1/healthz       # FastAPI : {BASE_API_URL}/healthz, BASE_API_URL=/api/v1
  port: 3000

resources:
  requests:
    cpu: "200m"
    memory: "512Mi"
  limits:
    cpu: "800m"
    memory: "2048Mi"

# securityContext — l'api tourne non-root (Dockerfile USER 1000) avec rootfs en lecture seule ;
# les écritures vont dans des emptyDirs (cf. volumes). Compatible PSA restricted (Atlas).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  capabilities:
    drop: ["ALL"]

# rootfs read-only → TMPDIR/HOME/POETRY_CACHE_DIR (cf. Dockerfile) montés en emptyDir.
volumes:
  - name: tmp
    emptyDir: {}
  - name: cache
    emptyDir: {}
  - name: home
    emptyDir: {}
volumeMounts:
  - name: tmp
    mountPath: /app/tmp
  - name: cache
    mountPath: /app/cache
  - name: home
    mountPath: /app/home

# Non-secret env injected directly. Per-env config goes in configMap.data (gitops).
env: {}

# Rendered into a ConfigMap (name = fullname) and loaded via envFrom.
# Per-env keys (gitops): API_PORT, API_HOST, ELASTIC_HOSTNAME, ALBERT_ENDPOINT, ALBERT_VECTORISATION_MODEL, ...
configMap:
  data: {}

# Names of pre-existing Secrets (created by ExternalSecrets in the gitops repo), loaded via envFrom.
# Map key = libellé libre ; value = nom du Secret. Mettre "" pour ignorer une entrée.
secrets:
  app: www-secret             # AUTH_API_KEY, ALBERT_API_KEY, ELASTIC_API_KEY

# Extra container env entries (raw items, support valueFrom).
extraEnv: []

serviceAccount:
  create: true
  name: ""

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Stakater Reloader (opt-in) : auto-restart du pod quand un ConfigMap/Secret référencé change.
reloader:
  auto: false
